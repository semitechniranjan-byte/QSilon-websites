# Render Blueprint — deploys this repo as a free Static Site.
# Render dashboard → New → Blueprint → select this repo → Apply.
services:
  - type: web
    name: qsilon-tensorv
    runtime: static
    branch: main
    # Stamp CSS/JS links with the commit id so browsers always load the latest files
    buildCommand: sed -i "s/?v=[A-Za-z0-9]*/?v=${RENDER_GIT_COMMIT:-$(date +%s)}/g" *.html
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    # Clean URLs: /services also opens services.html
    routes:
      - type: rewrite
        source: /services
        destination: /services.html
      - type: rewrite
        source: /solutions
        destination: /solutions.html
      - type: rewrite
        source: /about
        destination: /about.html
      - type: rewrite
        source: /contact
        destination: /contact.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Cache-Control
        value: no-cache
