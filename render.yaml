# Render Blueprint — deploys this repo as a free Static Site.
# Render dashboard → New → Blueprint → select this repo → Apply.
services:
  - type: web
    name: qsilon-tensorv
    runtime: static
    branch: main
    buildCommand: echo "Static site - no build needed"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    # Clean URLs: /services also opens services.html
    routes:
      - type: rewrite
        source: /services
        destination: /services.html
      - type: rewrite
        source: /solutions
        destination: /solutions.html
      - type: rewrite
        source: /about
        destination: /about.html
      - type: rewrite
        source: /contact
        destination: /contact.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
